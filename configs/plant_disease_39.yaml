
# YOLOv8 数据集配置文件
path: .  # ⚠️ 改成你的数据集根目录**绝对路径**（相对路径会被 Ultralytics 按其 datasets_dir 解析）
train: images/train  # 训练图片路径（相对 path）
val: images/val      # 验证图片路径（相对 path）

# 类别数量和名称
nc: 39  # 类别数量 (0-38共39个类别)
