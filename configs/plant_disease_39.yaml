  'Blueberry___healthy',                   # 健康蓝莓
  'Cherry___healthy',                      # 健康樱桃
  'Cherry___Powdery_mildew',               # 樱桃白粉病
  'Corn___Cercospora_leaf_spot Gray_leaf_spot',  # 玉米尾孢叶斑病
  'Corn___Common_rust',                    # 玉米普通锈病
