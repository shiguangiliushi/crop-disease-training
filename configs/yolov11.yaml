# generate_yolov11.yaml
# 植物病害检测模型 (轻量版)

# 参数
nc: 24  # 类别数
depth_multiple: 0.25  # 控制模型深度
width_multiple: 0.20  # 控制通道数

# 骨架
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [32, 3, 1]]  # 0
  - [-1, 1, Conv, [64, 3, 2]]  # 1-P1/2
  - [-1, 1, C3, [64]]          # 2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3, [128]]         # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 3, C3, [256]]         # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 1, C3, [512]]         # 8
  - [-1, 1, SPPF, [512, 5]]    # 9

# 头部
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]  # 11 连接P3
  - [-1, 1, C3, [256, False]]   # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]  # 14 连接P2
  - [-1, 1, C3, [128, False]]   # 15

  - [-1, 1, Conv, [128, 3, 2]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17 连接12的输出
  - [-1, 1, C3, [256, False]]  # 18

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]]  # 20 连接P4/16 (第9层)
  - [-1, 1, C3, [512, False]]  # 21

  - [[15, 18, 21], 1, Detect, [nc]] # 检测头 [P2, P3, P4]